<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statues | Statues | Ron English Catalogue Raisonne</title>

  <link rel="stylesheet" href="../../css/styles.css" />

  <style>
    :root{ --border:#e5e7eb; --muted:#4b5563; --shadow:0 10px 30px rgba(0,0,0,.08); --radius:18px; --bg:#ffffff; --panel:#f3f4f6; --pill-hover:#f9fafb; }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:#111; background:var(--bg); }
    .wrap{ max-width:1240px; margin:0 auto; padding:28px 18px 60px; }
    .page-narrow{ max-width:1100px; }
    .nav-pills{ display:flex; flex-wrap:wrap; gap:10px; margin:22px 0; justify-content:center; text-align:center; }
    .nav-pill{ padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; color:#111; text-decoration:none; font-size:14px; transition:background .12s ease,border-color .12s ease,transform .12s ease; }
    .nav-pill:hover{ background:var(--pill-hover); border-color:#d1d5db; transform:translateY(-1px); }
    .page-header{ max-width:1100px; margin:0 auto 28px; padding:0; text-align:center; }
    .page-title{ margin:0 0 10px; font-size:clamp(2rem,4vw,3rem); letter-spacing:-.02em; line-height:1.05; text-align:center; }
    .index-grid{ margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; justify-items:center; }
    .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; justify-items:center; margin-top:18px; }
    .gallery-item{ width:100%; display:block; text-decoration:none; color:inherit; background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,.04); margin:0; transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease; text-align:center; }
    .gallery-item:hover{ transform:translateY(-2px); box-shadow:0 16px 40px rgba(0,0,0,.12); border-color:#d1d5db; }
    .gallery-item a{ display:block; color:inherit; text-decoration:none; text-align:center; }
    .gallery-item img{ display:block; width:100%; object-fit:contain; object-position:center center; background:var(--panel); padding:10px; margin-left:auto; margin-right:auto; }
    .index-grid .gallery-item img{ height:260px; border-bottom:1px solid var(--border); }
    .gallery-grid .gallery-item img{ height:340px; }
    .entry-body{ width:100%; padding:16px 18px 18px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .work-title{ margin:0 auto; padding:0; width:100%; font-size:18px; line-height:1.35; font-weight:600; text-align:center; }
    .section-card{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin:0 0 24px; }
    .section-card h2{ text-align:center; margin:0 0 16px; font-size:1.4rem; }
    .back-link{ margin-top:28px; text-align:left; }
    .back-link a{ display:inline-block; text-decoration:none; color:#111; border:1px solid var(--border); border-radius:999px; padding:10px 16px; background:#fff; text-align:left; }
    .back-link a:hover{ background:#f9fafb; }
    footer{ margin-top:34px; padding-top:16px; border-top:1px solid var(--border); color:var(--muted); font-size:14px; text-align:center; }
    @media (max-width:560px){ .wrap{ padding:22px 14px 50px; } .index-grid,.gallery-grid{ grid-template-columns:1fr; } .index-grid .gallery-item img{ height:260px; } .gallery-grid .gallery-item img{ height:300px; } }
  </style>
  <style id="recent-sketches-caption-centering-v1">
    /* Keeps captions and card titles centered in recent sketch category pages. */
    .gallery-item,
    .gallery-item a,
    figure,
    figcaption,
    .entry-body,
    .work-title,
    .entry-title,
    .card-title,
    .gallery-title,
    .item-title,
    .caption,
    .thumb-caption,
    .image-caption,
    .work-caption,
    .caveat-text {
      text-align: center !important;
    }

    .entry-body,
    .work-title,
    .entry-title,
    .card-title,
    .gallery-title,
    .item-title,
    figcaption,
    .caption,
    .thumb-caption,
    .image-caption,
    .work-caption,
    .caveat-text {
      width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .caveat-text {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 720px;
    }
  </style>
  <link rel="icon" type="image/png" href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/favicon.png">
</head>
<body>
  <main class="wrap page-narrow">
    <nav class="nav-pills" aria-label="Site navigation">
      <a class="nav-pill" href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/">Catalogue home</a>
      <a class="nav-pill" href="https://ronenglish-archive.github.io/ron-english-sketches-and-drawings/Sketches/">Sketches</a>
    </nav>

    <header class="page-header">
      <h1 class="page-title">Statues</h1>

    <section class="index-grid" aria-label="Statues sketch and drawing pages">
      <a class="gallery-item" href="statue-of-liberty/index.html">
        <img src="../../images/Sketches/statues/Bigfoot%20Statue%20of%20Liberty%20COLOR.jpg" alt="Statue of Liberty drawing set by Ron English" loading="lazy" />
        <div class="entry-body"><p class="work-title">Statue of Liberty</p></div>
      </a>
      <a class="gallery-item" href="family-icon/index.html">
        <img src="../../images/Sketches/statues/Statues%20Family%20Icon%20COLOR.jpg" alt="Family Icon drawings by Ron English" loading="lazy" />
        <div class="entry-body"><p class="work-title">Family Icon</p></div>
      </a>
      <a class="gallery-item" href="liberty-eagle/index.html">
        <img src="../../images/Sketches/statues/Liberty%20Eagle%20front%20COLOR.jpg" alt="Liberty Eagle drawings by Ron English" loading="lazy" />

      <a class="gallery-item" href="liberty-indian-eagle/index.html">
        <img src="../../images/Sketches/statues/Liberty%20Indian%20Eagle%20Front%20COLOR.jpg" alt="Liberty Indian Eagle drawings by Ron English" loading="lazy" />
        <div class="entry-body"><p class="work-title">Liberty Indian Eagle</p></div>
      </a>
      <a class="gallery-item" href="liberty-seeds/index.html">
        <img src="../../images/Sketches/statues/Liberty%20Seeds%20COLOR.jpg" alt="Liberty Seeds drawings by Ron English" loading="lazy" />
        <div class="entry-body"><p class="work-title">Liberty Seeds</p></div>
      </a>
    </section>

    <footer>Published via GitHub Pages for long-term public access.</footer>
  </main>
</body>
</html>
