<!doctype html>
<html lang="en">
<head>

  <title>Ducks Test</title>
  <style>
    body{font-family:Arial,sans-serif;padding:30px;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
    img{width:100%;height:260px;object-fit:contain;background:#eee;padding:10px;}
  
    /* BEGIN SKETCHES CENTERING OVERRIDES */
    .nav-pills{
      justify-content:center;
      text-align:center;
    }

    .page-header{
      text-align:center;
      margin-left:auto;
      margin-right:auto;
    }

    .page-title,
    h1.page-title{
      text-align:center;
    }

    .intro-text{
      text-align:center;
      margin-left:auto;
      margin-right:auto;
    }

    .intro-text p{
      text-align:center;
      margin-left:auto;
      margin-right:auto;
    }

    .section-card h2,
    .section-card h3{
      text-align:center;
    }

    .section-intro{
      text-align:center;
      margin-left:auto;
      margin-right:auto;
    }

    .entry-body{
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .entry-body h3,
    .entry-body p,
    .work-title,
    .work-subtitle,
    .image-caption,
    .gallery-item .entry-body .work-title,
    .gallery-item .entry-body .work-subtitle,
    .gallery-item .entry-body .work-note{
      text-align:center;
      width:100%;
    }

    footer{
      text-align:center;
    }

    .back-link{
      text-align:left;
    }

    .back-link a{
      text-align:left;
    }

<body>
  <h1>Ducks Test</h1>

  <div class="grid">
    <img src="../../../images/Sketches/avians/ducks/Bub Quack sketch 7 COLOR.png" />
