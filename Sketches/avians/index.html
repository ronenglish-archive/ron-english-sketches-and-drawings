<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avians | Sketches and Drawings | Ron English Catalogue Raisonné</title>

<link rel="stylesheet" href="../../css/styles.css" />

<style>
:root{
  --border:#e5e7eb;
  --muted:#4b5563;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --radius:18px;
  --bg:#ffffff;
  --panel:#f3f4f6;
  --pill-hover:#f9fafb;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:#111;
  background:var(--bg);
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:28px 18px 60px;
}

.nav-pills{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:22px 0;
  text-align:center;
}

.nav-pill{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  color:#111;
  text-decoration:none;
  font-size:14px;
}

.nav-pill:hover{
  background:var(--pill-hover);
}

.page-header{
  max-width:1100px;
  margin:0 auto 28px;
  text-align:center;
}

.page-title{
  margin:0;
  font-size:clamp(2rem,4vw,3rem);
  letter-spacing:-.02em;
  line-height:1.05;
  text-align:center;
}

/* Established outlined catalogue-card appearance.
   Flex is used only so an incomplete last row centers correctly. */
.category-grid{
  margin-top:28px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:stretch;
  gap:18px;
}

.gallery-item{
  flex:0 1 calc((100% - 54px)/4);
  max-width:calc((100% - 54px)/4);
  display:block;
  text-decoration:none;
  color:inherit;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
  text-align:center;
}

.gallery-item:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(0,0,0,.12);
  border-color:#d1d5db;
}

.gallery-item img{
  width:100%;
  height:220px;
  object-fit:contain;
  object-position:center center;
  display:block;
  background:var(--panel);
  padding:10px;
  border-bottom:1px solid var(--border);
  margin:0;
}

.entry-body{
  padding:16px 18px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.work-title{
  margin:0;
  padding:0;
  width:100%;
  font-size:18px;
  line-height:1.35;
  font-weight:600;
  text-align:center;
}

footer{
  margin-top:34px;
  padding-top:16px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:14px;
  text-align:center;
}

@media (max-width:1100px){
  .gallery-item{
    flex-basis:calc((100% - 36px)/3);
    max-width:calc((100% - 36px)/3);
  }
}

@media (max-width:820px){
  .gallery-item{
    flex-basis:calc((100% - 18px)/2);
    max-width:calc((100% - 18px)/2);
  }
}

@media (max-width:640px){
  .wrap{padding:22px 14px 50px}
  .gallery-item{
    flex-basis:100%;
    max-width:100%;
  }
  .gallery-item img{height:240px}
}
</style>

<link rel="icon" type="image/png"
href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/favicon.png">
<style id="avians-parent-force-centering">
html,
body,
main,
.wrap,
nav,
.nav-pills,
.nav-pill,
header,
.page-header,
.page-title,
section,
.category-grid,
.gallery-item,
.gallery-item *,
.entry-body,
.work-title,
p,
a,
footer {
    text-align:center !important;
}

.nav-pills,
.category-grid,
.entry-body {
    justify-content:center !important;
}

.page-header,
.page-title,
.entry-body,
.work-title,
footer {
    margin-left:auto !important;
    margin-right:auto !important;
}

.gallery-item .entry-body,
.gallery-item .work-title,
.gallery-item p,
.gallery-item a {
    width:100% !important;
    text-align:center !important;
}
</style>
<style id="avians-global-force-centering">
/* Governing rule: center all displayed text throughout Avians pages. */
html,
body,

}

.nav-pills,
.index-grid,

    justify-content:center !important;
}

.page-header,
.page-title,
.intro-text,
.intro-text p,
.section-card,
.section-card h1,
.section-card h2,
.section-card h3,
.section-card p,
.entry-body,
.work-title,
.work-subtitle,
.work-note,
.metadata,

.notes,
.citation,
.relationship,
.prev-next,
footer {
    margin-left:auto !important;

}

.gallery-item .entry-body,
.gallery-item .work-title,
.gallery-item .work-subtitle,

    width:100% !important;
    text-align:center !important;
}
</style>
</head>
