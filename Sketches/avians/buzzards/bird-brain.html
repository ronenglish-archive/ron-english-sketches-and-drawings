<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bird Brain | Ron English Catalogue Raisonné</title>

  <link rel="stylesheet" href="../../../css/styles.css" />

  <style>
    :root{
      --border:#e5e7eb;
      --muted:#4b5563;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --radius:18px;
      --bg:#ffffff;
      --panel:#f3f4f6;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:#111;
      background:var(--bg);
      padding-left:0;
      padding-right:0;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:28px 18px 60px;
    }

    .nav-pills{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:22px;
      margin-bottom:22px;
    }

    .nav-pill{
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      text-decoration:none;
      font-size:14px;
    }

    .nav-pill:hover{
      background:#f9fafb;
    }

    .page-header{
      max-width:1100px;
      margin:0 0 28px;
      padding:0;
      text-align:left;
    }

    .page-title{
      margin:0 0 10px;
      font-size:clamp(2rem,4vw,3rem);
      letter-spacing:-.02em;
      line-height:1.05;
    }

    .section-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:24px;
    }

    .section-card h2{
      margin:0 0 14px;
      font-size:1.4rem;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .originals-grid{
      grid-template-columns:minmax(260px, 520px);
      justify-content:center;
    }

    .originals-grid .gallery-item{
      margin:0 auto;
    }

    .originals-grid .gallery-item img{
      height:520px;
      padding:8px;
    }

    .gallery-item{
      display:block;
      text-decoration:none;
      color:inherit;
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      transition:transform .18s ease, box-shadow .18s ease;
      box-shadow:0 4px 18px rgba(0,0,0,.04);
    }

    .gallery-item:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 24px rgba(0,0,0,.08);
    }

    .gallery-item img{
      display:block;
      width:100%;
      height:320px;
      object-fit:contain;
      background:var(--panel);
      padding:8px;
    }

    .back-link{
      margin-top:28px;
    }

    .back-link a{
      display:inline-block;
      text-decoration:none;
      color:#111;
      border:1px solid var(--border);
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
    }

    .back-link a:hover{
      background:#f9fafb;
    }

    @media (max-width:640px){
      .wrap{
        padding:22px 14px 50px;
      }

      .gallery-item img{
        height:240px;
      }

      .originals-grid .gallery-item img{
        height:420px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav-pills" aria-label="Site navigation">
      <a class="nav-pill" href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/">Catalogue home</a>
      <a class="nav-pill" href="../../index.html">Sketches</a>
      <a class="nav-pill" href="../index.html">Avians</a>
      <a class="nav-pill" href="index.html">Buzzards</a>
    </nav>

    <header class="page-header">
      <h1 class="page-title">Bird Brain</h1>
    </header>

    <section class="section-card" aria-labelledby="original-drawing">
      <h2 id="original-drawing">Original Drawing</h2>
      <div class="gallery-grid originals-grid">
        <a class="gallery-item" href="../../../images/Sketches/avians/buzzards/Bird%20Brain%20ORIGINAL.jpg">
          <img src="../../../images/Sketches/avians/buzzards/Bird%20Brain%20ORIGINAL.jpg" alt="Bird Brain original drawing by Ron English" loading="lazy" />
        </a>
      </div>
    </section>

    <section class="section-card" aria-labelledby="digitized-versions">
      <h2 id="digitized-versions">Digitized Versions</h2>
      <div class="gallery-grid">
        <a class="gallery-item" href="../../../images/Sketches/avians/buzzards/Bird%20Brain%20B%26W.jpg">
          <img src="../../../images/Sketches/avians/buzzards/Bird%20Brain%20B%26W.jpg" alt="Bird Brain black-and-white digital version by Ron English" loading="lazy" />
        </a>

        <a class="gallery-item" href="../../../images/Sketches/avians/buzzards/Bird%20Brain%20COLOR.jpg">
          <img src="../../../images/Sketches/avians/buzzards/Bird%20Brain%20COLOR.jpg" alt="Bird Brain color digital version by Ron English" loading="lazy" />
        </a>
      </div>
    </section>

    <div class="back-link">
      <a href="index.html">← Back to Buzzards</a>
    </div>
  </main>
</body>
</html>
