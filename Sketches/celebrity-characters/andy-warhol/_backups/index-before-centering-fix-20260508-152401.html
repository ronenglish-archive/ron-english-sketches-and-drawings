<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Andy Warhol | Celebrity Characters | Ron English Catalogue Raisonn&eacute;</title>
  <link rel="stylesheet" href="../../../css/styles.css" />
  <style>
    :root{
      --border:#e5e7eb;
      --muted:#4b5563;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --radius:18px;
      --bg:#ffffff;
      --panel:#f3f4f6;
      --pill-hover:#f9fafb;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:#111;
      background:var(--bg);
      padding-left:0;
      padding-right:0;
    }

    .wrap{
      max-width:1240px;
      margin:0 auto;
      padding:28px 18px 60px;
    }

    .page-narrow{ max-width:1100px; }

    .nav-pills{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:22px 0;
      justify-content:center;
      text-align:center;
    }

    .nav-pill{
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      text-decoration:none;
      font-size:14px;
      transition:background .12s ease,border-color .12s ease,transform .12s ease;
    }

    .nav-pill:hover{
      background:var(--pill-hover);
      border-color:#d1d5db;
      transform:translateY(-1px);
    }

    .page-header{
      max-width:1100px;
      margin:0 auto 28px;
      padding:0;
      text-align:center;
    }

    .page-title{
      margin:0 0 10px;
      font-size:clamp(2rem,4vw,3rem);
      letter-spacing:-.02em;
      line-height:1.05;
      text-align:center;
    }

    .intro-text{
      max-width:900px;
      margin:0 auto 28px;
      padding:0;
      line-height:1.6;
      text-align:center;
      color:var(--muted);
      font-size:18px;
    }

    .section-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:24px;
    }

    .section-card h2{
      margin:0 0 18px;
      font-size:1.4rem;
      text-align:center;
    }

    .section-intro{
      margin:0 auto;
      color:var(--muted);
      line-height:1.6;
      text-align:center;
      max-width:760px;
    }

    .index-grid{
      margin-top:28px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
    }

    .gallery-grid,
    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .originals-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .gallery-item{
      display:block;
      text-decoration:none;
      color:inherit;
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,.04);
      margin:0;
      transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
    }

    .gallery-item:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 40px rgba(0,0,0,.12);
      border-color:#d1d5db;
    }

    .gallery-item a{
      display:block;
      color:inherit;
      text-decoration:none;
    }

    .gallery-item img{
      display:block;
      width:100%;
      object-fit:contain;
      background:var(--panel);
      padding:10px;
      border-bottom:0;
    }

    .index-grid .gallery-item img{
      height:280px;
      border-bottom:1px solid var(--border);
    }

    .gallery-grid .gallery-item img{ height:320px; }
    .originals-grid .gallery-item img{ height:440px; }
    .card-grid .gallery-item img{ height:520px; }

    .entry-body{
      padding:16px 18px 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .work-title{
      margin:0;
      padding:0;
      width:100%;
      font-size:18px;
      line-height:1.35;
      font-weight:600;
      text-align:center;
    }

    .back-link{ margin-top:28px; text-align:left; }

    .back-link a{
      display:inline-block;
      text-decoration:none;
      color:#111;
      border:1px solid var(--border);
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
      text-align:left;
    }

    .back-link a:hover{ background:#f9fafb; }

    footer{
      margin-top:34px;
      padding-top:16px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }

    @media (max-width:900px){
      .index-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }

    @media (max-width:560px){
      .wrap{ padding:22px 14px 50px; }
      .index-grid,
      .gallery-grid,
      .card-grid,
      .originals-grid{ grid-template-columns:1fr; }
      .index-grid .gallery-item img,
      .gallery-grid .gallery-item img{ height:260px; }
      .originals-grid .gallery-item img{ height:340px; }
      .card-grid .gallery-item img{ height:420px; }
    }
  </style>
</head>
<body>
  <main class="wrap page-narrow">
    <nav class="nav-pills" aria-label="Site navigation">
      <a class="nav-pill" href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/">Catalogue home</a>
      <a class="nav-pill" href="../../index.html">Sketches</a>
      <a class="nav-pill" href="../index.html">Celebrity Characters</a>
    </nav>

    <header class="page-header">
      <h1 class="page-title">Andy Warhol</h1>
    </header>

    <p class="intro-text">Character groups and related Warhol-inspired drawings in this section.</p>

    <section class="index-grid" aria-label="Andy Warhol character groups">
      <a class="gallery-item" href="david-warhol/index.html">
        <img src="../../../images/Sketches/celebrity-characters/Andy%20Warhol/David%20Warhol%201.jpg" alt="David Warhol drawings by Ron English" loading="lazy" />
        <div class="entry-body">
          <p class="work-title">David Warhol</p>
        </div>
      </a>
      <a class="gallery-item" href="pop-tot-baby-warhol/index.html">
        <img src="../../../images/Sketches/celebrity-characters/Andy%20Warhol/Pop%20Tot%20Baby%20Warhol%20COLOR.jpg" alt="Pop Tot Baby Warhol drawings by Ron English" loading="lazy" />
        <div class="entry-body">
          <p class="work-title">Pop Tot Baby Warhol</p>
        </div>
      </a>
      <a class="gallery-item" href="young-andy/index.html">
        <img src="../../../images/Sketches/celebrity-characters/Andy%20Warhol/Young%20Andy%20ORIGINAL.jpg" alt="Young Andy drawings by Ron English" loading="lazy" />
        <div class="entry-body">
          <p class="work-title">Young Andy</p>
        </div>
      </a>
    </section>

    <div class="back-link">
      <a href="../index.html">&larr; Back to Celebrity Characters</a>
    </div>

    <footer>
      Published via GitHub Pages for long-term public access.
    </footer>
  </main>
</body>
</html>
