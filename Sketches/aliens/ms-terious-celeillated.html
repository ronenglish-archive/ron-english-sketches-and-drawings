<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ms Terious Celeillated | Ron English Catalogue Raisonné</title>

  <link rel="stylesheet" href="../../css/styles.css" />

  <style>
    :root{
      --border:#e5e7eb;
      --muted:#4b5563;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --radius:18px;
      --bg:#ffffff;
      --panel:#f3f4f6;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:#111;
      background:var(--bg);
      padding-left:0;
      padding-right:0;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:28px 18px 60px;
    }

    .nav-pills{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:22px;
      margin-bottom:22px;
    }

    .nav-pill{
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      text-decoration:none;
      font-size:14px;
    }

    .nav-pill:hover{
      background:#f9fafb;
    }

    .page-header{
      max-width:1100px;
      margin:0 0 28px;
      padding:0;
      text-align:left;
    }

    .page-title{
      margin:0 0 10px;
      font-size:clamp(2rem,4vw,3rem);
      letter-spacing:-.02em;
      line-height:1.05;
    }

    .section-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:24px;
    }

    .section-card h2{
      margin:0 0 8px;
      font-size:1.4rem;
    }

    .section-intro{
      margin:0 0 18px;
      color:var(--muted);
      line-height:1.6;
      max-width:72ch;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .sketch-hero-grid{
      display:grid;
      grid-template-columns:minmax(280px,560px);
      gap:20px;
      justify-content:center;
    }

    .gallery-item{
      display:block;
      text-decoration:none;
      color:inherit;
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      transition:transform .18s ease, box-shadow .18s ease;
      box-shadow:0 4px 18px rgba(0,0,0,.04);
    }

    .gallery-item:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 24px rgba(0,0,0,.08);
    }

    .gallery-item img{
      display:block;
      width:100%;
      height:280px;
      object-fit:contain;
      background:var(--panel);
      padding:6px;
      border-bottom:1px solid var(--border);
    }

    .sketch-hero-grid .gallery-item{
      max-width:560px;
      width:100%;
      margin:0 auto;
    }

    .sketch-hero-grid .gallery-item img{
      height:620px;
      background:var(--panel);
      padding:8px;
    }

    .entry-body{
      padding:10px 12px 12px;
      text-align:center;
    }

    .gallery-item .entry-body .work-title{
      margin:0 0 4px;
      padding:0;
      font-size:1rem;
      font-weight:600;
      line-height:1.3;
      text-align:center;
    }

    .gallery-item .entry-body .work-note{
      margin:0;
      padding:0;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.35;
      text-align:center;
    }

    .back-link{
      margin-top:28px;
    }

    .back-link a{
      display:inline-block;
      text-decoration:none;
      color:#111;
      border:1px solid var(--border);
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
    }

    .back-link a:hover{
      background:#f9fafb;
    }

    @media (max-width:640px){
      .wrap{
        padding:22px 14px 50px;
      }

      .gallery-item img{
        height:240px;
      }

      .sketch-hero-grid{
        grid-template-columns:1fr;
      }

      .sketch-hero-grid .gallery-item img{
        height:520px;
      }
    }
  </style>
</head>
